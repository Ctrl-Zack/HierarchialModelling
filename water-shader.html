<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exported Water Shader</title>
<style>body { margin: 0; overflow: hidden; background-color: #000; }</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4, 4, 4);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const geometry = new THREE.PlaneGeometry(15, 15, 512, 512);

const uniforms = {
    uTime: { value: 0 },
    uBigWavesElevation: { value: 0 },
    uBigWavesFrequency: { value: new THREE.Vector2(2.8, 1) },
    uBigWavesSpeed: { value: 0.31 },
    uSmallWavesElevation: { value: 0.09 },
    uSmallWavesFrequency: { value: 0.7 },
    uSmallWavesSpeed: { value: 0.05 },
    uSmallIterations: { value: 4.0 },
    uDepthColor: { value: new THREE.Color('#03579b') },
    uSurfaceColor: { value: new THREE.Color('#2081d2') },
    uColorOffset: { value: 0.06 },
    uColorMultiplier: { value: 3.6 },
    uOpacity: { value: 0.93 },
    uShininess: { value: 150 },
    uFresnelPower: { value: 4.1 },
    uLightPosition: { value: new THREE.Vector3(5.0, 8.0, 5.0) }
};

const vertexShader = `
        uniform float uTime;
        uniform float uBigWavesElevation;
        uniform vec2 uBigWavesFrequency;
        uniform float uBigWavesSpeed;
        uniform float uSmallWavesElevation;
        uniform float uSmallWavesFrequency;
        uniform float uSmallWavesSpeed;
        uniform float uSmallIterations;

        varying float vElevation;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying vec3 vWorldPosition;

        vec4 permute(vec4 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        vec3 fade(vec3 t) { return t*t*t*(t*(t*6.0-15.0)+10.0); }

        float cnoise(vec3 P) {
            vec3 Pi0 = floor(P); 
            vec3 Pi1 = Pi0 + vec3(1.0); 
            Pi0 = mod(Pi0, 289.0);
            Pi1 = mod(Pi1, 289.0);
            vec3 Pf0 = fract(P); 
            vec3 Pf1 = Pf0 - vec3(1.0); 
            vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
            vec4 iy = vec4(Pi0.yy, Pi1.yy);
            vec4 iz0 = Pi0.zzzz;
            vec4 iz1 = Pi1.zzzz;
            vec4 ixy = permute(permute(ix) + iy);
            vec4 ixy0 = permute(ixy + iz0);
            vec4 ixy1 = permute(ixy + iz1);
            vec4 gx0 = ixy0 / 7.0;
            vec4 gy0 = fract(floor(gx0) / 7.0) - 0.5;
            gx0 = fract(gx0);
            vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
            vec4 sz0 = step(gz0, vec4(0.0));
            gx0 -= sz0 * (step(0.0, gx0) - 0.5);
            gy0 -= sz0 * (step(0.0, gy0) - 0.5);
            vec4 gx1 = ixy1 / 7.0;
            vec4 gy1 = fract(floor(gx1) / 7.0) - 0.5;
            gx1 = fract(gx1);
            vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
            vec4 sz1 = step(gz1, vec4(0.0));
            gx1 -= sz1 * (step(0.0, gx1) - 0.5);
            gy1 -= sz1 * (step(0.0, gy1) - 0.5);
            vec3 g000 = vec3(gx0.x,gy0.x,gz0.x);
            vec3 g100 = vec3(gx0.y,gy0.y,gz0.y);
            vec3 g010 = vec3(gx0.z,gy0.z,gz0.z);
            vec3 g110 = vec3(gx0.w,gy0.w,gz0.w);
            vec3 g001 = vec3(gx1.x,gy1.x,gz1.x);
            vec3 g101 = vec3(gx1.y,gy1.y,gz1.y);
            vec3 g011 = vec3(gx1.z,gy1.z,gz1.z);
            vec3 g111 = vec3(gx1.w,gy1.w,gz1.w);
            vec4 norm0 = taylorInvSqrt(vec4(dot(g000, g000), dot(g100, g100), dot(g010, g010), dot(g110, g110)));
            g000 *= norm0.x; g100 *= norm0.y; g010 *= norm0.z; g110 *= norm0.w;
            vec4 norm1 = taylorInvSqrt(vec4(dot(g001, g001), dot(g101, g101), dot(g011, g011), dot(g111, g111)));
            g001 *= norm1.x; g101 *= norm1.y; g011 *= norm1.z; g111 *= norm1.w;
            float n000 = dot(g000, Pf0);
            float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
            float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
            float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
            float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
            float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
            float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
            float n111 = dot(g111, Pf1);
            vec3 s = fade(Pf0);
            vec4 nx = mix(vec4(n000, n010, n001, n011), vec4(n100, n110, n101, n111), s.x);
            vec2 ny = mix(nx.xz, nx.yw, s.y);
            return 2.2 * mix(ny.x, ny.y, s.z);
        }

        float getElevation(vec2 pos) {
            float elevation = sin(pos.x * uBigWavesFrequency.x + uTime * uBigWavesSpeed) *
                              sin(pos.y * uBigWavesFrequency.y + uTime * uBigWavesSpeed) *
                              uBigWavesElevation;
            for(float i = 1.0; i <= uSmallIterations; i++) {
                elevation -= abs(cnoise(vec3(pos * uSmallWavesFrequency * i, uTime * uSmallWavesSpeed)) * uSmallWavesElevation / i);
            }
            return elevation;
        }

        void main() {
            vec4 modelPosition = modelMatrix * vec4(position, 1.0);
            float elevation = getElevation(modelPosition.xz);
            modelPosition.y += elevation;
            
            float shift = 0.05;
            float eX = getElevation(modelPosition.xz + vec2(shift, 0.0));
            float eZ = getElevation(modelPosition.xz + vec2(0.0, shift));
            vec3 v1 = vec3(shift, eX - elevation, 0.0);
            vec3 v2 = vec3(0.0, eZ - elevation, shift);
            vNormal = normalize(cross(v2, v1));

            vec4 viewPosition = viewMatrix * modelPosition;
            gl_Position = projectionMatrix * viewPosition;
            vElevation = elevation;
            vViewPosition = -viewPosition.xyz;
            vWorldPosition = modelPosition.xyz;
        }
`;

const fragmentShader = `
        uniform vec3 uDepthColor;
        uniform vec3 uSurfaceColor;
        uniform float uColorOffset;
        uniform float uColorMultiplier;
        uniform float uOpacity;
        uniform float uShininess;
        uniform float uFresnelPower;
        uniform vec3 uLightPosition;
        varying float vElevation;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying vec3 vWorldPosition;

        void main() {
            vec3 normal = normalize(vNormal);
            vec3 viewDir = normalize(vViewPosition);
            vec3 lightDir = normalize(uLightPosition - vWorldPosition);
            vec3 halfDir = normalize(lightDir + viewDir);

            float mixStrength = (vElevation + uColorOffset) * uColorMultiplier;
            vec3 waterColor = mix(uDepthColor, uSurfaceColor, clamp(mixStrength, 0.0, 1.0));

            float specular = pow(max(dot(normal, halfDir), 0.0), uShininess);
            float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), uFresnelPower);
            
            vec3 finalColor = mix(waterColor, vec3(0.8, 0.9, 1.0), fresnel * 0.4);
            finalColor += specular * 0.6;

            gl_FragColor = vec4(finalColor, uOpacity);
        }
`;

const material = new THREE.ShaderMaterial({
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
    uniforms: uniforms,
    transparent: true,
    side: THREE.DoubleSide
});

const mesh = new THREE.Mesh(geometry, material);
mesh.rotation.x = -Math.PI * 0.5;
scene.add(mesh);

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
const animate = () => {
    uniforms.uTime.value = clock.getElapsedTime();
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
};
animate();
</script>
</body>
</html>
